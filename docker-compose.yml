version: '3.4'

networks:
  studentappnetwork:  

services:
  studentappDB:
    container_name: studentappDB
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
     - 8002:1433
    env_file:
     - .env
    environment:
     - ACCEPT_EULA=${ACCEPT}
     - MSSQL_SA_PASSWORD=${PASSWORD}
    networks:
     - studentappnetwork
  studentapp:
    container_name: studentapp
    ports:
     - 8001:80 
    image: ${DOCKER_REGISTRY-}studentapp
    build:
      context: .
      dockerfile: StudentApp/Dockerfile
    depends_on:
     - studentappDB
    networks:
     - studentappnetwork
